    .app-name { font-size: 13px; font-weight: bold; color: #fff; line-height: 1.2; }
    .app-rating { font-size: 11px; color: #f59e0b; }
    .btn-top {
      background: #facc15; color: #000; font-weight: bold; font-size: 12px;
      padding: 5px 12px; border-radius: 15px; text-decoration: none;

    .hero-container { position: relative; width: 100%; height: 380px; overflow: hidden; background: #222; }

      position: absolute; bottom: 0; left: 0; width: 100%; height: 130px;
      background: linear-gradient(to bottom, transparent, #0b0b0d);
    }
    .content-wrap { padding: 0 20px; text-align: center; }

    .novel-body { text-align: left; font-size: 15px; color: #d4d4d8; }
    .novel-body p { margin-bottom: 16px; }
    .novel-body p:first-of-type::first-letter { font-size: 24px; font-weight: bold; color: #facc15; float: left; padding-right: 4px; }
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; padding: 14px 20px 20px;
      background: linear-gradient(to top, #0b0b0d 80%, transparent); text-align: center; z-index: 50;
    }
    .btn-main {
      display: flex; align-items: center; justify-content: center; width: 100%; max-width: 360px;
      margin: 0 auto; height: 44px; background: #facc15; color: #000; border-radius: 22px;
      font-size: 14px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 15px rgba(250, 204, 21, 0.35);
    }
    .sub-hint { font-size: 10px; color: #71717a; margin-top: 6px; }

</head>
<body onclick="handleClick(event)">
  <header class="top-bar">
    <div class="app-info">
      <div class="app-icon"></div>
      <div>
        <div class="app-name">${inputs.appName.value}</div>
        <div class="app-rating">${inputs.appRate.value}</div>
      </div>
    </div>
    <a href="${inputs.targetLink.value}" class="btn-top">Read Free</a>
  </header>

  <div class="hero-container">
    <img class="hero-img" src="${currentCover}" alt="Cover">
    <div class="hero-fade"></div>
  </div>

  <main class="content-wrap">
    <h1 class="title">${inputs.title.value}</h1>
    <p class="subtitle">${inputs.subtitle.value}</p>
    <div class="tag">• START READING •</div>
    <div class="tag">${inputs.chapter.value}</div>
    <div class="pov-tag">${inputs.pov.value}</div>

    <div class="novel-body">
      ${bodyHtml}
    </div>
  </main>

  <footer class="bottom-bar">
    <a href="${inputs.targetLink.value}" class="btn-main">${inputs.btnText.value}</a>
    <div class="sub-hint">Tap anywhere to keep reading in the app</div>
  </footer>

  <script>
    const LINK = "${inputs.targetLink.value}";
    let taps = 0;
    function handleClick(e) {
      if (e.target.closest('.bottom-bar') || e.target.closest('.top-bar')) return;
      taps++;
      if (taps >= 3) {
        window.location.href = LINK;
      }
    }
  <\/script>
</body>
